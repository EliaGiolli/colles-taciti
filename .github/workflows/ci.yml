# Continuous integration: runs on every pull request and on every push to main.
#
# Two jobs run in parallel:
# - `quality`: typecheck, lint, unit + integration tests with coverage, build.
# - `e2e`: builds the site and runs Playwright + axe against `astro preview`.
#
# Coverage is posted as a comment on the PR for information only: no
# threshold can fail the build (see docs/PLAN.md › Qualità e test).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Git hooks are for local machines; CI runs the checks explicitly.
  LEFTHOOK: "0"

jobs:
  quality:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to post the coverage comment on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Astro's CLI runs on Node (engines: >=22.12); Bun installs packages and runs scripts.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # --frozen-lockfile: fail instead of silently updating bun.lock.
      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit and integration tests (with coverage)
        run: bun run test:coverage
      - name: Build
        run: bun run build

      - name: Coverage report on the PR
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Only Chromium is used (desktop and 375px projects); --with-deps also
      # installs the system libraries the browser needs on Ubuntu.
      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e

      # Keep the HTML report (with traces of retried tests) when something fails.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
